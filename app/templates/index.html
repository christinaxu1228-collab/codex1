<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>SHEIN 批量上品</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;max-width:1100px;margin:32px auto;color:#222}section{border:1px solid #ddd;padding:18px;margin:14px 0;border-radius:8px}button{background:#111;color:#fff;border:0;padding:10px 18px;border-radius:5px;cursor:pointer}input,select{padding:7px;margin:4px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid #ddd;padding:6px}.note{color:#666}#result{white-space:pre-wrap;background:#f6f6f6;padding:12px}</style></head><body><h1>SHEIN 半托管女装批量上品</h1><p>类目编号仅用于识别工作表；200 USD 是初始申报价，不代表 SHEIN 核价结果。</p><section><h2>1. 上传官方 XLSX 模板</h2><input id="template" type="file" accept=".xlsx"><button onclick="inspect()">识别工作表</button></section><section><h2>2. 导入商品资料</h2><p>支持 CSV/JSON：category,title,description_en,sku,supplier_code,color,size,stock,price,image_url，以及模板属性字段。</p><label>默认申报供货价（USD）<input id="defaultPrice" type="number" min="0" step="0.01" value="200.00"></label><input id="products" type="file" accept=".csv,.json"><button onclick="validateData()">检查并预览</button> <button onclick="saveDrafts()">保存草稿</button> <button onclick="exportFile()">确认价格并导出 XLSX</button><p class="note">导出前请确认最终价格；系统会回读 XLSX 的 SKU 和 cost，不一致时阻止下载。</p></section><section><h2>3. 商品预览、SKU 与核价管理</h2><div id="table"></div></section><div id="result">等待操作…</div><script>
const out=document.querySelector('#result'), table=document.querySelector('#table');let currentRows=[];const statuses=['待提交','已提交，待核价','核价通过','核价未通过','需要调整报价'];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function inspect(){let f=new FormData();f.append('template',template.files[0]);fetch('/api/inspect',{method:'POST',body:f}).then(r=>r.json()).then(j=>out.textContent=JSON.stringify(j,null,2))}
function render(){table.innerHTML='<table><tr><th>商品货号</th><th>SKU</th><th>类目</th><th>颜色</th><th>尺码</th><th>库存</th><th>最终申报价 USD</th><th>SHEIN反馈价格</th><th>核价状态</th><th>备注</th></tr>'+currentRows.map((p,i)=>'<tr><td><input data-i="'+i+'" class="supplier_code" value="'+esc(p.supplier_code||'')+'"></td><td><input data-i="'+i+'" class="sku" value="'+esc(p.sku||'')+'"></td><td>'+esc(p.category)+'</td><td>'+esc(p.color||'')+'</td><td>'+esc(p.size||'')+'</td><td>'+esc(p.stock||'')+'</td><td><input data-i="'+i+'" class="price" value="'+esc(p.price)+'"></td><td><input data-i="'+i+'" class="feedback" value="'+esc(p.shein_feedback_price||'')+'"></td><td><select data-i="'+i+'" class="status">'+statuses.map(s=>'<option '+(s===(p.pricing_status||'待提交')?'selected':'')+'>'+s+'</option>').join('')+'</select></td><td><input data-i="'+i+'" class="note" value="'+esc(p.pricing_note||'')+'"></td></tr>').join('')+'</table>';document.querySelectorAll('[data-i]').forEach(e=>e.onchange=()=>{let p=currentRows[e.dataset.i];if(e.className==='price')p.price=Number(e.value).toFixed(2);else p[e.className]=e.value})}
async function validateData(){let f=new FormData();f.append('products',products.files[0]);f.append('default_price',defaultPrice.value||'200.00');let j=await (await fetch('/api/validate',{method:'POST',body:f})).json();currentRows=j.preview||[];render();out.textContent=JSON.stringify({count:j.count,errors:j.errors},null,2)}
async function saveDrafts(){out.textContent=JSON.stringify(await (await fetch('/api/drafts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({products:currentRows})})).json(),null,2)}
async function exportFile(){let f=new FormData();f.append('template',template.files[0]);f.append('products',new Blob([JSON.stringify(currentRows)],{type:'application/json'}),'edited-products.json');f.append('default_price',defaultPrice.value||'200.00');let r=await fetch('/api/export',{method:'POST',body:f});if((r.headers.get('content-type')||'').includes('json')){out.textContent=JSON.stringify(await r.json(),null,2);return}let a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='shein_products.xlsx';a.click()}
</script></body></html>
