<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>SHEIN 批量上品</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;max-width:900px;margin:40px auto;color:#222}section{border:1px solid #ddd;padding:20px;margin:16px 0;border-radius:8px}button{background:#111;color:#fff;border:0;padding:10px 18px;border-radius:5px;cursor:pointer}#result{white-space:pre-wrap;background:#f6f6f6;padding:12px}</style></head><body><h1>SHEIN 半托管女装批量上品</h1><p>支持女士两件套（95-1780）、女士短连衣裙（67-1727）、女士连体裤（154-1860）。</p><section><h2>1. 选择官方 XLSX 模板</h2><input id="template" type="file" accept=".xlsx"><button onclick="inspect()">识别工作表</button></section><section><h2>2. 导入商品资料</h2><p>CSV 或 JSON；字段：category,title,description_en,sku,color,size,price,stock,image_url</p><input id="products" type="file" accept=".csv,.json"><button onclick="validateData()">检查数据</button> <button onclick="exportFile()">导出 XLSX</button></section><div id="result">等待操作…</div><script>const out=document.querySelector('#result');async function inspect(){let f=new FormData();f.append('template',template.files[0]);let r=await fetch('/api/inspect',{method:'POST',body:f});out.textContent=JSON.stringify(await r.json(),null,2)}async function validateData(){let f=new FormData();f.append('products',products.files[0]);let r=await fetch('/api/validate',{method:'POST',body:f});out.textContent=JSON.stringify(await r.json(),null,2)}async function exportFile(){let f=new FormData();f.append('template',template.files[0]);f.append('products',products.files[0]);let r=await fetch('/api/export',{method:'POST',body:f});if(!r.ok){out.textContent=await r.text();return}let j=r.headers.get('content-type')||'';if(j.includes('json')){out.textContent=JSON.stringify(await r.json(),null,2);return}let a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='shein_products.xlsx';a.click()}</script></body></html>
