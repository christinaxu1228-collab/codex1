<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>SHEIN 批量上品</title><style>body{font-family:sans-serif;max-width:1100px;margin:32px auto}section{border:1px solid #ddd;padding:18px;margin:14px 0;border-radius:8px}button{background:#111;color:#fff;border:0;padding:9px 15px;border-radius:5px}input,select{padding:6px;margin:3px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid #ddd;padding:5px}#result{white-space:pre-wrap;background:#f6f6f6;padding:10px}</style></head><body><h1>SHEIN 半托管女装批量上品</h1><section><h2>1. 上传官方 XLSX 模板</h2><input id="template" type="file" accept=".xlsx"><button onclick="inspect()">识别工作表</button></section><section><h2>2. 导入商品资料</h2><input id="products" type="file" accept=".csv,.json"><label>默认申报供货价 USD <input id="defaultPrice" value="200.00"></label><button onclick="validateData()">检查并预览</button><button onclick="saveDrafts()">保存草稿</button><button onclick="loadDrafts()">加载草稿</button><button onclick="exportFile()">导出 XLSX</button></section><section><h2>3. 商品预览与核价管理</h2><label>批量设置面料弹性 <select id="batchElasticity"><option value="低弹">低弹（Slight Stretch）</option><option value="无弹">无弹（Non-Stretch）</option><option value="中弹">中弹（Medium Stretch）</option><option value="高弹">高弹（High Stretch）</option></select></label> <button onclick="applyElasticity()">批量应用</button><span id="batchCount"></span><div id="table"></div></section><div id="result">等待操作…</div><script>
const out=document.querySelector('#result'),table=document.querySelector('#table');let currentRows=[];const statuses=['待提交','已提交，待核价','核价通过','核价未通过','需要调整报价'];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function applyElasticity(){let n=currentRows.filter(p=>!p.attr_39).length;if(!confirm('将修改 '+n+' 件尚未填写面料弹性的商品，已有值不会覆盖。继续吗？'))return;currentRows.forEach(p=>{if(!p.attr_39)p.attr_39=batchElasticity.value});render();out.textContent='已批量应用 '+batchElasticity.value+'，修改 '+n+' 件'}
function render(){table.innerHTML='<table><tr><th>货号</th><th>SKU</th><th>类目</th><th>主规格</th><th>主规格内容</th><th>面料弹性 attr_39</th><th>材质 attr_160</th><th>价格 USD</th><th>状态</th><th>备注</th></tr>'+currentRows.map((p,i)=>'<tr><td><input data-i="'+i+'" class="supplier_code" value="'+esc(p.supplier_code||'')+'"></td><td><input data-i="'+i+'" class="sku" value="'+esc(p.sku||'')+'"></td><td>'+esc(p.category)+'</td><td><input data-i="'+i+'" class="main_attribute" value="'+esc(p.main_attribute||'颜色')+'"></td><td><input data-i="'+i+'" class="main_attribute_value" value="'+esc(p.main_attribute_value||p.color||'')+'"></td><td><select data-i="'+i+'" class="attr_39"><option value="">待确认</option><option value="无弹" '+(p.attr_39==='无弹'?'selected':'')+'>无弹</option><option value="低弹" '+(p.attr_39==='低弹'?'selected':'')+'>低弹</option><option value="中弹" '+(p.attr_39==='中弹'?'selected':'')+'>中弹</option><option value="高弹" '+(p.attr_39==='高弹'?'selected':'')+'>高弹</option></select></td><td><input data-i="'+i+'" class="attr_160" value="'+esc(p.attr_160||'')+'"></td><td><input data-i="'+i+'" class="price" value="'+esc(p.price||'')+'"></td><td><select data-i="'+i+'" class="pricing_status">'+statuses.map(s=>'<option '+(s===(p.pricing_status||'待提交')?'selected':'')+'>'+s+'</option>').join('')+'</select></td><td><input data-i="'+i+'" class="pricing_note" value="'+esc(p.pricing_note||'')+'"></td></tr>').join('')+'</table>';document.querySelectorAll('[data-i]').forEach(e=>e.onchange=()=>{let p=currentRows[e.dataset.i];p[e.className]=e.className==='price'?Number(e.value).toFixed(2):e.value})}
async function inspect(){let f=new FormData();f.append('template',template.files[0]);let j=await(await fetch('/api/inspect',{method:'POST',body:f})).json();out.textContent=JSON.stringify(j,null,2)}async function validateData(){let f=new FormData();f.append('products',products.files[0]);f.append('default_price',defaultPrice.value||'200.00');let j=await(await fetch('/api/validate',{method:'POST',body:f})).json();currentRows=j.preview||[];render();out.textContent=JSON.stringify({count:j.count,errors:j.errors},null,2)}async function saveDrafts(){out.textContent=JSON.stringify(await(await fetch('/api/drafts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({products:currentRows})})).json(),null,2)}async function loadDrafts(){let j=await(await fetch('/api/drafts')).json();currentRows=j.products||[];render();out.textContent='已加载 '+currentRows.length+' 条草稿'}async function exportFile(){let f=new FormData();f.append('template',template.files[0]);f.append('products',new Blob([JSON.stringify(currentRows)],{type:'application/json'}),'edited-products.json');f.append('default_price',defaultPrice.value||'200.00');let r=await fetch('/api/export',{method:'POST',body:f});if((r.headers.get('content-type')||'').includes('json')){out.textContent=JSON.stringify(await r.json(),null,2);return}let a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='shein_products.xlsx';a.click()}
</script></body></html>
