<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>SHEIN 批量上品</title><style>body{font-family:sans-serif;max-width:1100px;margin:32px auto}section{border:1px solid #ddd;padding:18px;margin:14px 0;border-radius:8px}button{background:#111;color:#fff;border:0;padding:9px 15px;border-radius:5px}input,select{padding:6px;margin:3px;box-sizing:border-box}table{border-collapse:collapse;width:100%;font-size:13px;table-layout:fixed}th,td{border:1px solid #ddd;padding:5px;vertical-align:top;min-width:90px}th:nth-child(2),td:nth-child(2){min-width:130px}th:nth-child(3),td:nth-child(3){min-width:150px}th:nth-child(8),td:nth-child(8){min-width:180px}th:nth-child(9),td:nth-child(9){min-width:110px}.img-cell{width:300px;min-width:300px;height:190px}.image-strip{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;overflow-y:hidden;width:285px;height:170px;padding:2px}.image-item{position:relative;flex:0 0 120px;width:120px;height:160px;box-sizing:border-box}.thumb{display:block;width:120px;height:160px;max-width:120px;max-height:160px;object-fit:contain;background:#f4f4f4;cursor:zoom-in}.image-item button{position:absolute;right:1px;bottom:1px;padding:3px 5px;font-size:11px;background:#a00}.image-url-editor{width:285px;max-width:285px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.image-lightbox{max-width:90vw;max-height:90vh}.image-lightbox::backdrop{background:rgba(0,0,0,.7)}#result{white-space:pre-wrap;background:#f6f6f6;padding:10px}</style></head><body><h1>SHEIN 半托管女装批量上品</h1><section><h2>1. 上传官方 XLSX 模板</h2><input id="template" type="file" accept=".xlsx"><button onclick="inspect()">识别工作表</button></section><section><h2>2. 导入商品资料</h2><input id="products" type="file" accept=".csv,.json"><label>默认申报供货价 USD <input id="defaultPrice" value="200.00"></label><button onclick="validateData()">检查并预览</button><button onclick="saveDrafts()">保存草稿</button><button onclick="loadDrafts()">加载草稿</button><button onclick="exportFile()">导出 XLSX</button></section><section><h2>3. 批量上传商品图片</h2><p>本地图片会持久化到 product_images，并按 SKU/货号关联。没有公开 URL 时不会伪造链接，正式导出前请填写 SHEIN 接受的图片 URL。</p><input id="imageFiles" type="file" accept=".jpg,.jpeg,.png,.webp" multiple><input id="imageSku" placeholder="SKU 或商品货号（可选）"><select id="imageType"><option value="display">商品展示图（按上传顺序）</option></select><button onclick="uploadImages()">上传并关联</button><button onclick="checkImages()">检查图片完整性</button><h3>外部 HTTPS 图片 URL</h3><textarea id="imageUrls" rows="3" style="width:100%" placeholder="每行：SKU,图片URL；仅使用你有权使用的 HTTPS 链接"></textarea><button onclick="importImageUrls()">下载并关联 URL</button><input id="imageCsv" type="file" accept=".csv"><button onclick="importImageCsv()">导入图片 CSV</button></section><section><h2>4. 商品预览与核价管理</h2><label>批量设置面料弹性 <select id="batchMaterial"><option value="">批量材质（先识别模板）</option></select> <button onclick="applyMaterial()">批量应用材质</button> <select id="batchElasticity"><option value="低弹">低弹（Slight Stretch）</option><option value="无弹">无弹（Non-Stretch）</option><option value="中弹">中弹（Medium Stretch）</option><option value="高弹">高弹（High Stretch）</option></select></label> <button onclick="applyElasticity()">批量应用</button><span id="batchCount"></span><div id="table"></div></section><div id="result">等待操作…</div><dialog id="imagePreviewDialog"><button type="button" onclick="imagePreviewDialog.close()">关闭</button><img id="imagePreview" class="image-lightbox"></dialog><script>
const out=document.querySelector('#result'),table=document.querySelector('#table');let currentRows=[];let templateMetadata={};const statuses=['待提交','已提交，待核价','核价通过','核价未通过','需要调整报价'];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function applyMaterial(){let value=batchMaterial.value;if(!value)return;let n=currentRows.filter((p,i)=>document.querySelector('[data-select=\"'+i+'\"]')?.checked&&!p.attr_160).length;if(!confirm('将修改 '+n+' 件尚未填写材质的商品，已有值不会覆盖。继续吗？'))return;let skipped=[];currentRows.forEach((p,i)=>{let box=document.querySelector('[data-select=\"'+i+'\"]');if(!box?.checked)return;if(p.attr_160)return;let allowed=templateMetadata[p.category]?.options?.attr_160||[];if(!allowed.includes(value)){skipped.push(p.sku+' / '+p.category+'：该类目不接受此材质');return}p.attr_160=value});render();out.textContent='已批量应用材质 '+value+'，修改 '+n+' 件'+(skipped.length?'\n跳过：\n'+skipped.join('\n'):'')}
function applyElasticity(){let n=currentRows.filter(p=>!p.attr_39).length;if(!confirm('将修改 '+n+' 件尚未填写面料弹性的商品，已有值不会覆盖。继续吗？'))return;currentRows.forEach(p=>{if(!p.attr_39)p.attr_39=batchElasticity.value});render();out.textContent='已批量应用 '+batchElasticity.value+'，修改 '+n+' 件'}
function previewImage(url){if(!url)return;imagePreview.src=url;imagePreviewDialog.showModal()}
function imageControls(p,i){let imgs=(p.images?.display||[]);if(!Array.isArray(imgs))imgs=[imgs];return '<div class="image-strip" data-img-row="'+i+'">'+imgs.map((a,n)=>'<span draggable="true" data-img-item="'+i+'" data-img-index="'+n+'">'+(a?.url?'<img class="thumb" src="'+esc(a.url)+'" onclick="previewImage(\''+esc(a.url)+\'\')">:'<small>本地待托管</small>')+' <button type="button" data-del-img="'+i+'" data-img-index="'+n+'">删除</button></span>').join('')+'</div><input data-i="'+i+'" class="image_url image-url-editor" value="'+esc((imgs[0]?.url||p.image_url||''))+'" placeholder="公开图片 URL">'}
function bindImageControls(){document.querySelectorAll('[data-del-img]').forEach(b=>b.onclick=()=>{let p=currentRows[b.dataset.delImg],a=p.images?.display||[];if(!Array.isArray(a))a=[a];a.splice(Number(b.dataset.imgIndex),1);p.images=Object.assign({},p.images||{},{display:a});render()});document.querySelectorAll('[data-img-item]').forEach(el=>{el.ondragstart=e=>e.dataTransfer.setData('text/plain',JSON.stringify([el.dataset.imgItem,el.dataset.imgIndex]));el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();let [row,from]=JSON.parse(e.dataTransfer.getData('text/plain'));if(row!==el.dataset.imgItem)return;let a=currentRows[row].images.display;let item=a.splice(Number(from),1)[0];a.splice(Number(el.dataset.imgIndex),0,item);render()}})}
function render(){table.innerHTML='<table><tr><th>选择</th><th>货号</th><th>SKU</th><th>类目</th><th>主规格</th><th>主规格内容</th><th>面料弹性 attr_39</th><th>材质 attr_160</th><th>价格 USD</th><th>主图 URL</th><th>状态</th><th>备注</th></tr>'+currentRows.map((p,i)=>'<tr><td><input type="checkbox" data-select="'+i+'"></td><td><input data-i="'+i+'" class="supplier_code" value="'+esc(p.supplier_code||'')+'"></td><td><input data-i="'+i+'" class="sku" value="'+esc(p.sku||'')+'"></td><td>'+esc(p.category)+'</td><td><input data-i="'+i+'" class="main_attribute" value="'+esc(p.main_attribute||'颜色')+'"></td><td><input data-i="'+i+'" class="main_attribute_value" value="'+esc(p.main_attribute_value||p.color||'')+'"></td><td><select data-i="'+i+'" class="attr_39"><option value="">待确认</option><option value="无弹" '+(p.attr_39==='无弹'?'selected':'')+'>无弹</option><option value="低弹" '+(p.attr_39==='低弹'?'selected':'')+'>低弹</option><option value="中弹" '+(p.attr_39==='中弹'?'selected':'')+'>中弹</option><option value="高弹" '+(p.attr_39==='高弹'?'selected':'')+'>高弹</option></select></td><td><input data-i="'+i+'" class="attr_160" list="materials-'+i+'" value="'+esc(p.attr_160||'')+'"></td><td><datalist id="materials-'+i+'">'+(templateMetadata[p.category]?.options?.attr_160||[]).map(v=>'<option value="'+esc(v)+'">').join('')+'</datalist></td><td><input data-i="'+i+'" class="price" value="'+esc(p.price||'')+'"></td><td class="img-cell">'+imageControls(p,i)+'</td><td><select data-i="'+i+'" class="pricing_status">'+statuses.map(s=>'<option '+(s===(p.pricing_status||'待提交')?'selected':'')+'>'+s+'</option>').join('')+'</select></td><td><input data-i="'+i+'" class="pricing_note" value="'+esc(p.pricing_note||'')+'"></td></tr>').join('')+'</table>';document.querySelectorAll('[data-i]').forEach(e=>e.onchange=()=>{let p=currentRows[e.dataset.i];if(e.className==='image_url'){p.image_url=e.value;p.images=Object.assign({},p.images||{},{display:e.value?[e.value]:[]})}else p[e.className]=e.className==='price'?Number(e.value).toFixed(2):e.value});bindImageControls()}
async function uploadImages(){if(!imageFiles.files.length){out.textContent='请选择图片';return}let f=new FormData();[...imageFiles.files].forEach(x=>f.append('files',x));f.append('sku',imageSku.value);f.append('image_type',imageType.value);let j=await(await fetch('/api/images/upload',{method:'POST',body:f})).json();let target=currentRows.find(p=>p.sku===imageSku.value||p.supplier_code===imageSku.value||(!imageSku.value&&p.sku===j.assets?.[0]?.sku));if(target&&j.assets?.length){target.images=target.images||{};let existing=target.images.display||[];if(!Array.isArray(existing))existing=[existing];target.images.display=existing.concat(j.assets);render()}out.textContent=JSON.stringify(j,null,2)}
async function importImageUrls(){let items=imageUrls.value.split('\n').map(line=>{let [sku,url]=line.split(',').map(x=>x.trim());return {sku,url}}).filter(x=>x.url);let j=await(await fetch('/api/images/import-urls',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items})})).json();attachImported(j.assets||[]);out.textContent=JSON.stringify(j,null,2)}
async function importImageCsv(){if(!imageCsv.files.length){out.textContent='请选择 CSV';return}let f=new FormData();f.append('file',imageCsv.files[0]);let j=await(await fetch('/api/images/import-csv',{method:'POST',body:f})).json();attachImported(j.assets||[]);out.textContent=JSON.stringify(j,null,2)}
function attachImported(assets){assets.forEach(a=>{let p=currentRows.find(x=>x.sku===a.sku||x.supplier_code===a.supplier_code);if(!p)return;p.images=p.images||{};let list=p.images.display||[];if(!Array.isArray(list))list=[list];list.push(a);p.images.display=list});render()}
function checkImages(){let issues=[];currentRows.forEach(p=>{let imgs=p.images?.display||[];if(!Array.isArray(imgs))imgs=[imgs];if(imgs.length<2)issues.push(p.sku+'：商品展示图少于 2 张');imgs.forEach((a,n)=>{if(!a?.url)issues.push(p.sku+'：第 '+(n+1)+' 张图片尚无公开 URL，不能正式导出');if(a?.width&&a?.height&&Math.abs(a.width/a.height-.75)>.01)issues.push(p.sku+'：第 '+(n+1)+' 张图片不是 3:4 比例')})});out.textContent=issues.length?'图片检查结果：\n'+issues.join('\n'):'图片关联检查通过（仍需以官方模板规则复核）'}
async function inspect(){let f=new FormData();f.append('template',template.files[0]);let j=await(await fetch('/api/inspect',{method:'POST',body:f})).json();templateMetadata=j.metadata||{};let all=[...new Set(Object.values(templateMetadata).flatMap(x=>x.options?.attr_160||[]))];batchMaterial.innerHTML='<option value="">批量材质（主动应用）</option>'+all.map(v=>'<option>'+esc(v)+'</option>').join('');out.textContent=JSON.stringify(j,null,2)}async function validateData(){let f=new FormData();f.append('products',products.files[0]);f.append('default_price',defaultPrice.value||'200.00');let j=await(await fetch('/api/validate',{method:'POST',body:f})).json();currentRows=j.preview||[];render();out.textContent=JSON.stringify({count:j.count,errors:j.errors},null,2)}async function saveDrafts(){out.textContent=JSON.stringify(await(await fetch('/api/drafts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({products:currentRows})})).json(),null,2)}async function loadDrafts(){let j=await(await fetch('/api/drafts')).json();currentRows=j.products||[];render();out.textContent='已加载 '+currentRows.length+' 条草稿'}async function exportFile(){let f=new FormData();f.append('template',template.files[0]);f.append('products',new Blob([JSON.stringify(currentRows)],{type:'application/json'}),'edited-products.json');f.append('default_price',defaultPrice.value||'200.00');let r=await fetch('/api/export',{method:'POST',body:f});if((r.headers.get('content-type')||'').includes('json')){out.textContent=JSON.stringify(await r.json(),null,2);return}let a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='shein_products.xlsx';a.click()}
</script></body></html>
